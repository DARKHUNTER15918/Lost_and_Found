# ========================================================
# Server Configuration
# ========================================================
server.port=8080
server.servlet.context-path=/

# ========================================================
# MySQL Database Configuration
# ========================================================
# Make sure MySQL service is running on localhost:3306
# createDatabaseIfNotExist=true will automatically create the database if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/campus_lostfound_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# JPA / Hibernate Configuration
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================================
# File Upload Configuration
# ========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
# Directory to store uploaded item pictures
app.upload.dir=uploads

# ========================================================
# Thymeleaf Configuration
# ========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ========================================================
# Logging
# ========================================================
logging.level.com.campus.lostfound=INFO
logging.level.org.springframework.security=INFO
