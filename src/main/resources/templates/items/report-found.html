<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item - Campus Lost & Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- Breadcrumb -->
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/items}">Items</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Report Found Item</li>
                    </ol>
                </nav>

                <!-- Flash Alerts -->
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <!-- Form Card -->
                <div class="custom-card shadow-sm">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="stat-icon" style="background-color: #dcfce7; color: #16a34a; width: 52px; height: 52px; font-size: 1.5rem;">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0">Report a Found Item</h4>
                            <p class="text-muted small mb-0">Thank you for being a responsible campus citizen! Report the found item to reunite it with its owner.</p>
                        </div>
                    </div>

                    <form th:action="@{/items/report-found}" th:object="${itemDto}" method="post" enctype="multipart/form-data">
                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label">Item Title / Name *</label>
                            <input type="text" id="title" th:field="*{title}" class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Silver Titan Watch or Student ID Card" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <!-- Category & Date Found -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="categoryId" class="form-label">Category *</label>
                                <select id="categoryId" th:field="*{categoryId}" class="form-select"
                                        th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''" required>
                                    <option value="">-- Select Category --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="itemDate" class="form-label">Date Found *</label>
                                <input type="date" id="itemDate" th:field="*{itemDate}" class="form-control"
                                       th:classappend="${#fields.hasErrors('itemDate')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('itemDate')}" th:errors="*{itemDate}"></div>
                            </div>
                        </div>

                        <!-- Location Found -->
                        <div class="mb-3">
                            <label for="location" class="form-label">Campus Location Where Found *</label>
                            <input type="text" id="location" th:field="*{location}" class="form-control"
                                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Sports Complex Badminton Court bench, or Lab 302" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Description &amp; Where Item Is Currently Kept *</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="4"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                      placeholder="Describe what was found. Mention where the item is kept safe (e.g. Handed to security guard, with class representative, etc.)" required></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <!-- Image Upload -->
                        <div class="mb-4">
                            <label for="imageFile" class="form-label">Upload Item Photo (Optional, Recommended)</label>
                            <input type="file" id="imageFile" th:field="*{imageFile}" class="form-control" accept="image/*">
                            <small class="text-muted">Accepted formats: JPG, PNG, WEBP (Max 10MB)</small>

                            <!-- Live Image Preview -->
                            <div id="imagePreviewContainer" class="mt-3 d-none">
                                <p class="small text-muted mb-1">Image Preview:</p>
                                <img id="imagePreview" src="#" alt="Preview" class="img-thumbnail rounded" style="max-height: 200px;">
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/items}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                            <button type="submit" class="btn btn-success px-4 rounded-pill fw-semibold shadow-sm">
                                <i class="bi bi-send me-1"></i> Post Found Item Report
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
