<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Report - Campus Lost & Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- Breadcrumb -->
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/items}">Items</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Edit Report</li>
                    </ol>
                </nav>

                <!-- Flash Alerts -->
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <!-- Form Card -->
                <div class="custom-card shadow-sm">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="stat-icon" style="background-color: #ede9fe; color: #7c3aed; width: 52px; height: 52px; font-size: 1.5rem;">
                            <i class="bi bi-pencil-square"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0">Edit Item Report</h4>
                            <p class="text-muted small mb-0">Update item details, location, status, or replace image</p>
                        </div>
                    </div>

                    <form th:action="@{'/items/edit/' + ${itemDto.id}}" th:object="${itemDto}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{reportType}">
                        <input type="hidden" th:field="*{existingImageUrl}">

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label">Item Title / Name *</label>
                            <input type="text" id="title" th:field="*{title}" class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <!-- Category, Status & Date in row -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="categoryId" class="form-label">Category *</label>
                                <select id="categoryId" th:field="*{categoryId}" class="form-select" required>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="status" class="form-label">Status *</label>
                                <select id="status" th:field="*{status}" class="form-select" required>
                                    <option value="OPEN">OPEN</option>
                                    <option value="CLAIMED">CLAIMED</option>
                                    <option value="CLOSED">CLOSED</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="itemDate" class="form-label">Date *</label>
                                <input type="date" id="itemDate" th:field="*{itemDate}" class="form-control" required>
                            </div>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label for="location" class="form-label">Campus Location *</label>
                            <input type="text" id="location" th:field="*{location}" class="form-control" required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Detailed Description *</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="4" required></textarea>
                        </div>

                        <!-- Existing Image Preview & Replace -->
                        <div class="mb-4">
                            <div th:if="${itemDto.existingImageUrl != null}" class="mb-2">
                                <span class="form-label d-block">Current Image:</span>
                                <img th:src="${itemDto.existingImageUrl}" alt="Current" class="img-thumbnail rounded" style="max-height: 150px;">
                            </div>

                            <label for="imageFile" class="form-label">Replace Image (Optional)</label>
                            <input type="file" id="imageFile" th:field="*{imageFile}" class="form-control" accept="image/*">
                            <small class="text-muted">Upload a new picture to overwrite the current one.</small>

                            <!-- Live Image Preview -->
                            <div id="imagePreviewContainer" class="mt-3 d-none">
                                <p class="small text-muted mb-1">New Image Preview:</p>
                                <img id="imagePreview" src="#" alt="Preview" class="img-thumbnail rounded" style="max-height: 200px;">
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{'/items/' + ${itemDto.id}}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4 rounded-pill fw-semibold shadow-sm">
                                <i class="bi bi-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
