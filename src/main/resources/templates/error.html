<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Campus Lost & Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container text-center py-5">
        <div class="stat-icon mx-auto mb-4" style="background-color: #fee2e2; color: #dc2626; width: 72px; height: 72px; font-size: 2.2rem;">
            <i class="bi bi-shield-x"></i>
        </div>
        <h2 class="fw-bold mb-2">Access Restricted or Error Occurred</h2>
        <p class="text-muted mb-4" style="max-width: 500px; margin: 0 auto;">
            You might not have permission to view this resource, or the requested page was not found on the server.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-navy px-4 rounded-pill">
                <i class="bi bi-house me-1"></i> Return Home
            </a>
            <a th:href="@{/items}" class="btn btn-outline-secondary px-4 rounded-pill">
                <i class="bi bi-grid me-1"></i> Browse Items
            </a>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
