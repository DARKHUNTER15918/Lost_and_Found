<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Campus Lost & Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Flash Alerts -->
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <!-- Registration Card -->
                <div class="custom-card shadow-sm">
                    <div class="text-center mb-4">
                        <div class="stat-icon mx-auto mb-3" style="background-color: #ede9fe; color: #7c3aed; width: 56px; height: 56px; font-size: 1.6rem;">
                            <i class="bi bi-person-plus"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Create Student Account</h4>
                        <p class="text-muted small">Register with your campus details to report and claim lost items</p>
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post">
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name *</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Alex Johnson" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Campus Email Address *</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="student@campus.edu" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <!-- Student Roll No / ID and Phone in row -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="studentId" class="form-label">Student ID / Roll No</label>
                                <input type="text" id="studentId" th:field="*{studentId}" class="form-control"
                                       placeholder="e.g. CSE-2024-042">
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Contact Phone</label>
                                <input type="text" id="phone" th:field="*{phone}" class="form-control"
                                       placeholder="e.g. +1 555-0142">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password * (Min 6 characters)</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   placeholder="Create a secure password" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm Password *</label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                   placeholder="Re-type your password" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                            <i class="bi bi-person-check me-1"></i> Register Account
                        </button>
                    </form>

                    <!-- Already have account -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="small text-muted mb-0">
                            Already registered? 
                            <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--accent-purple);">Sign In Here</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
