<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - Admin Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-4">
    <div class="container">

        <!-- Header -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-tags me-2 text-primary"></i> Manage Categories</h3>
                <p class="text-muted small mb-0">Add new categories or manage existing classification tags for campus reports</p>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Admin Dashboard
            </a>
        </div>

        <!-- Flash Alerts -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="row g-4">
            <!-- Add Category Form -->
            <div class="col-lg-4">
                <div class="custom-card p-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-1 text-primary"></i> Add New Category</h5>
                    <form th:action="@{/admin/categories/add}" th:object="${category}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Category Name *</label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. Lab Equipment" required>
                        </div>
                        <div class="mb-3">
                            <label for="icon" class="form-label">Bootstrap Icon Class</label>
                            <input type="text" id="icon" th:field="*{icon}" class="form-control" placeholder="e.g. bi-cpu, bi-briefcase">
                            <small class="text-muted">Use any <a href="https://icons.getbootstrap.com/" target="_blank">Bootstrap Icons</a> class.</small>
                        </div>
                        <div class="mb-4">
                            <label for="description" class="form-label">Short Description</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Explain what items fall under this..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i> Create Category
                        </button>
                    </form>
                </div>
            </div>

            <!-- Existing Categories Table -->
            <div class="col-lg-8">
                <div class="custom-card p-4">
                    <h5 class="fw-bold mb-3">Existing Categories (<span th:text="${#lists.size(categories)}">0</span>)</h5>
                    <div class="table-responsive">
                        <table class="table table-custom mb-0">
                            <thead>
                                <tr>
                                    <th>Icon</th>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td>
                                        <div class="stat-icon" style="background-color: #ede9fe; color: #7c3aed; width: 36px; height: 36px; font-size: 1.1rem;">
                                            <i class="bi" th:classappend="${cat.icon != null ? cat.icon : 'bi-folder'}"></i>
                                        </div>
                                    </td>
                                    <td>
                                        <strong th:text="${cat.name}">Electronics</strong>
                                    </td>
                                    <td class="small text-muted" th:text="${cat.description}">Laptops, chargers...</td>
                                    <td class="text-end">
                                        <form th:action="@{'/admin/categories/' + ${cat.id} + '/delete'}" method="post" class="confirm-delete d-inline" th:attr="data-item-name=${cat.name}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-2 py-1" title="Delete Category">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
