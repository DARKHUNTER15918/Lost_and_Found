<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Lost & Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">

                <!-- Flash Alerts -->
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <!-- Login Card -->
                <div class="custom-card shadow-sm">
                    <div class="text-center mb-4">
                        <div class="stat-icon mx-auto mb-3" style="background-color: #ede9fe; color: #7c3aed; width: 56px; height: 56px; font-size: 1.6rem;">
                            <i class="bi bi-person-lock"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Welcome Back</h4>
                        <p class="text-muted small">Sign in to your student or administrator account</p>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <!-- Email Input -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" name="email" class="form-control" placeholder="e.g., student@campus.edu" required autofocus>
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>

                    <!-- Registration link -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="small text-muted mb-0">
                            Don't have an account yet? 
                            <a th:href="@{/register}" class="fw-bold text-decoration-none" style="color: var(--accent-purple);">Register as Student</a>
                        </p>
                    </div>
                </div>

                <!-- College Project Demo Credentials Box -->
                <div class="card mt-4 border-0 shadow-sm" style="background-color: #f1f5f9;">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center gap-2 mb-2 text-primary fw-bold small">
                            <i class="bi bi-info-circle-fill"></i>
                            <span>Quick Demo Credentials (Pre-seeded)</span>
                        </div>
                        <div class="row g-2 small text-secondary">
                            <div class="col-6">
                                <div class="p-2 bg-white rounded border">
                                    <span class="badge bg-primary mb-1">Admin</span><br>
                                    <strong>Email:</strong> admin@campus.edu<br>
                                    <strong>Pass:</strong> admin123
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-2 bg-white rounded border">
                                    <span class="badge bg-success mb-1">Student</span><br>
                                    <strong>Email:</strong> student@campus.edu<br>
                                    <strong>Pass:</strong> student123
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
